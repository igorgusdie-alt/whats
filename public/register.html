<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Atendentes - Web Net</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-xl font-bold text-gray-800 mb-6 text-center">Cadastrar Novo Atendente</h2>
        
        <form onsubmit="cadastrarAtendente(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nome do Atendente</label>
                <input type="text" id="reg-name" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" placeholder="Ex: João Silva">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">E-mail</label>
                <input type="email" id="reg-email" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" placeholder="joao@webnet.com">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Senha temporária</label>
                <input type="password" id="reg-password" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:border-emerald-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded font-semibold hover:bg-emerald-700 transition">Cadastrar Atendente</button>
        </form>

        <div id="mensagem" class="mt-4 text-center text-sm font-semibold"></div>

        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-emerald-600 hover:underline">← Voltar para o Painel de Login</a>
        </div>
    </div>

    <script>
        async function cadastrarAtendente(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const msgEl = document.getElementById('mensagem');

            msgEl.innerText = 'Cadastrando...';
            msgEl.className = 'mt-4 text-center text-sm font-semibold text-gray-500';

            try {
                const res = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Erro ao cadastrar');

                msgEl.innerText = 'Atendente cadastrado com sucesso!';
                msgEl.className = 'mt-4 text-center text-sm font-semibold text-emerald-600';
                
                // Limpa os campos
                document.getElementById('reg-name').value = '';
                document.getElementById('reg-email').value = '';
                document.getElementById('reg-password').value = '';

            } catch (err) {
                msgEl.innerText = 'Erro: ' + err.message;
                msgEl.className = 'mt-4 text-center text-sm font-semibold text-red-600';
            }
        }
    </script>
</body>
</html>
